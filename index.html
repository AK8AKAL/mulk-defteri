<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12140F">
<title>Mülk Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== GİRİŞ EKRANI ===================== -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-mark">MD</div>
    <h1 class="auth-title">Mülk Defteri</h1>
    <p class="auth-sub">Binalarınızı ve kiralarınızı tek yerden takip edin.</p>

    <form id="auth-form" class="auth-form">
      <label class="field">
        <span>E-posta</span>
        <input type="email" id="auth-email" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Şifre</span>
        <input type="password" id="auth-password" autocomplete="current-password" required minlength="6">
      </label>
      <p id="auth-error" class="auth-error" hidden></p>
      <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Giriş yap</button>
    </form>

    <button id="auth-toggle" class="auth-toggle">Hesabınız yok mu? Hesap oluşturun</button>
  </div>
</div>

<!-- ===================== UYGULAMA KABUĞU ===================== -->
<div id="app-shell" class="app-shell" hidden>

  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-mark">MD</span>
      <h1 id="page-title">Panel</h1>
    </div>
    <button id="logout-btn" class="icon-btn" title="Çıkış yap" aria-label="Çıkış yap">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <main class="views">

    <!-- ---------- PANEL (Dashboard) ---------- -->
    <section id="view-panel" class="view view--active">
      <div class="stat-grid">
        <div class="stat-card stat-card--accent">
          <span class="stat-number" id="stat-income">₺0</span>
          <span class="stat-label">Aylık toplam kira geliri</span>
        </div>
      </div>

      <div class="status-legend">
        <div class="legend-row"><span class="dot dot--rented"></span> Kirada <b id="count-rented">0</b></div>
        <div class="legend-row"><span class="dot dot--vacant"></span> Boş <b id="count-vacant">0</b></div>
        <div class="legend-row"><span class="dot dot--private"></span> Özel kullanım <b id="count-private">0</b></div>
      </div>
    </section>

    <!-- ---------- BİNALAR ---------- -->
    <section id="view-buildings" class="view">
      <div id="buildings-list" class="building-list"></div>
    </section>

    <!-- ---------- BİNA DETAY ---------- -->
    <section id="view-building-detail" class="view">
      <button id="back-to-buildings" class="back-link">← Binalar</button>
      <div id="building-detail-card" class="building-detail-card"></div>

      <div class="section-row">
        <h2 class="section-heading">Bağımsız Bölümler</h2>
      </div>
      <div id="building-properties-list" class="property-list"></div>
    </section>

    <!-- ---------- KİRACILAR ---------- -->
    <section id="view-tenants" class="view">
      <div class="search-bar">
        <input type="text" id="tenant-search" placeholder="Bina veya kiracı ara…">
      </div>
      <div id="tenants-list" class="property-list"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab tab--active" data-view="panel">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Panel</span>
    </button>
    <button class="tab" data-view="buildings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><line x1="9" y1="7" x2="9" y2="7.01"/><line x1="15" y1="7" x2="15" y2="7.01"/><line x1="9" y1="11" x2="9" y2="11.01"/><line x1="15" y1="11" x2="15" y2="11.01"/><line x1="9" y1="15" x2="9" y2="15.01"/><line x1="15" y1="15" x2="15" y2="15.01"/></svg>
      <span>Binalar</span>
    </button>
    <button class="tab" data-view="tenants">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Kiracılar</span>
    </button>
  </nav>
</div>

<!-- ===================== MODAL: BAĞIMSIZ BÖLÜM FORMU ===================== -->
<div id="property-modal" class="sheet-overlay" hidden>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="property-modal-title" class="sheet-title">Bağımsız bölümü düzenle</h2>
    <form id="property-form" class="sheet-form">
      <input type="hidden" id="p-id">
      <input type="hidden" id="p-buildingid">
      <div class="field-row">
        <label class="field"><span>Kat</span><input type="text" id="p-kat"></label>
        <label class="field"><span>No</span><input type="text" id="p-no"></label>
      </div>
      <label class="field"><span>Nitelik</span><input type="text" id="p-nitelik" placeholder="Konut, Büro, Restoran…" required></label>
      <label class="field">
        <span>Durum</span>
        <select id="p-durum">
          <option value="Kirada">Kirada</option>
          <option value="Boş">Boş</option>
          <option value="Özel Kullanım">Özel Kullanım</option>
        </select>
      </label>
      <div id="p-tenant-fields">
        <label class="field"><span>Kiracı</span><input type="text" id="p-kiraci"></label>
        <label class="field" id="p-kira-field"><span>Kira bedeli (₺)</span><input type="number" id="p-kirabedeli" min="0" step="100"></label>
        <label class="field" id="p-tarih-field"><span>Sözleşme tarihi</span><input type="date" id="p-sozlesme"></label>
      </div>
      <div class="sheet-buttons">
        <button type="button" class="btn btn-ghost" data-close-modal>Vazgeç</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- Firebase SDK (compat, script-tag build – ekstra derleme aracı gerekmez) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
